<title>AI From Zero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky HUD, then one screen at a time (world map → mission → rapid fire → boss → victory), centered column */
:root{
  --paper:#EDF0EA; --card:#FFFFFF; --ink:#1A1E29; --muted:#5B6371; --line:#D3D8CF;
  --accent:#3346E8; --accent-ink:#FFFFFF; --hi:#FFB21E; --good:#16875A; --bad:#C93A2E; --soft:#E4E8FA;
  --t0:#FFD6C4; --t1:#C6E8D2; --t2:#CDD8FF; --t3:#FFE8A3; --t4:#EAD2F6; --t5:#C5EBEE;
  --cat:#F07828; --dog:#5A6EFF; --pink:#E8508C; --teal:#1FA7A0;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101318; --card:#191D25; --ink:#ECEEE7; --muted:#9BA2AE; --line:#2B303B;
  --accent:#8E9BFF; --accent-ink:#0D1020; --hi:#FFC550; --good:#4CC98F; --bad:#FF7B6F; --soft:#232A47;
  --t0:#5C3526; --t1:#22493A; --t2:#2E3B6E; --t3:#58481A; --t4:#48304F; --t5:#1E4A4E;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#101318; --card:#191D25; --ink:#ECEEE7; --muted:#9BA2AE; --line:#2B303B;
  --accent:#8E9BFF; --accent-ink:#0D1020; --hi:#FFC550; --good:#4CC98F; --bad:#FF7B6F; --soft:#232A47;
  --t0:#5C3526; --t1:#22493A; --t2:#2E3B6E; --t3:#58481A; --t4:#48304F; --t5:#1E4A4E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.hud .wrap{display:flex;align-items:center;gap:8px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:1.15rem;border:0;background:none;padding:0;margin-right:auto}
.brand-mark{display:inline-flex;gap:2px}
.brand-mark i{width:8px;height:18px;border-radius:3px;background:var(--t0)}
.brand-mark i:nth-child(2){background:var(--t2)}.brand-mark i:nth-child(3){background:var(--t3)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:.85rem;font-family:var(--mono)}
button.pill:hover{border-color:var(--accent)}
.xpbar{width:56px;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:var(--hi);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.starg{color:var(--hi)}
main.wrap{padding-block:18px 0}

/* ---------- shared ---------- */
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 18px;font-weight:700;transition:transform .15s,background .2s,border-color .2s}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 55%,var(--ink))}
.btn.primary:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%,var(--ink))}
.btn.primary:disabled{background:var(--line);border-color:var(--line);color:var(--muted);box-shadow:none}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:.82rem}
.btn.go{animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-3px)}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;background:var(--paper);flex-wrap:wrap}
.seg-b{border:0;background:none;border-radius:8px;padding:7px 12px;font-weight:700;font-size:.9rem;color:var(--muted)}
.seg-b.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-block:12px}
.hint{color:var(--muted);font-size:.9rem;margin:8px 0 0}
.lbl,.tag{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.panel{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--paper);min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;min-width:0}
.scr{animation:enter .4s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes floatup{to{transform:translateY(-60px);opacity:0}}
@keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--accent) 22%,transparent)}}
.actbar{position:sticky;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:14px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--paper);margin-top:8px}
.bub{margin:0;padding:9px 13px;border-radius:14px;max-width:85%;width:fit-content;animation:pop .35s both}
.bub.u{background:var(--accent);color:var(--accent-ink);margin-left:auto;border-bottom-right-radius:4px}
.bub.ai{background:var(--soft);border-bottom-left-radius:4px}
.divider{text-align:center;font-family:var(--mono);font-size:.75rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.verdict{margin-top:12px;padding:10px 14px;border-radius:10px;background:color-mix(in srgb,var(--hi) 18%,var(--card));border:1px solid color-mix(in srgb,var(--hi) 50%,var(--line))}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.flow .f{padding:8px 12px;border-radius:10px;background:var(--paper);border:1px solid var(--line);font-weight:700}
.flow .ar{color:var(--muted);font-family:var(--mono)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:12px;padding:14px;animation:pop .45s both;animation-delay:var(--d,0s)}
.tile b{display:block;font-family:var(--display);font-size:1.4rem}
.tile span{color:var(--muted);font-size:.9rem}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--card);padding:10px 18px;border-radius:99px;font-weight:700;animation:pop .3s both;max-width:calc(100% - 32px);text-align:center}
.xpfloat{position:fixed;z-index:60;font-family:var(--display);font-weight:800;color:var(--hi);font-size:1.4rem;pointer-events:none;animation:floatup 1.1s forwards;text-shadow:0 1px 0 var(--ink)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}

/* ---------- Tok the bot ---------- */
.bot{width:46px;height:46px;flex:none;animation:bob 3s ease-in-out infinite}
.bot .head{fill:var(--accent)}
.bot .ant{stroke:var(--accent);stroke-width:2.5}
.bot .tip{fill:var(--hi)}
.bot .eyes circle{fill:var(--accent-ink);transform-origin:center;transform-box:fill-box;animation:blink 4s infinite}
.bot path{fill:none;stroke:var(--accent-ink);stroke-width:2.4;stroke-linecap:round}
.bot .m2,.bot .m3{display:none}
.bot[data-mood="happy"] .m1,.bot[data-mood="oops"] .m1{display:none}
.bot[data-mood="happy"] .m2{display:block}
.bot[data-mood="oops"] .m3{display:block}
.bot[data-mood="happy"]{animation:hop .5s 2}
.bot[data-mood="oops"]{animation:shake .4s}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes hop{50%{transform:translateY(-8px) rotate(-6deg)}}

/* ---------- world map ---------- */
.maphead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.maphead h1{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:800}
.world{position:relative;max-width:560px;margin:0 auto}
.world svg.trail{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.trail path{fill:none;stroke-width:6;stroke-linecap:round;vector-effect:non-scaling-stroke}
.trail .p0{stroke:var(--line);stroke-dasharray:2 14}
.trail .p1{stroke:var(--good);stroke-dasharray:2 14}
.node{position:absolute;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:800;font-size:1.6rem;box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 55%,var(--ink));transition:transform .15s,box-shadow .15s;display:grid;place-items:center}
.node:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 55%,var(--ink))}
.node.cleared{background:var(--good);box-shadow:0 6px 0 color-mix(in srgb,var(--good) 55%,var(--ink));color:var(--card)}
.node.locked{background:var(--line);color:var(--muted);box-shadow:0 6px 0 color-mix(in srgb,var(--line) 60%,var(--ink))}
.node.cur{animation:pulse 1.6s ease-in-out infinite}
.node.final{width:90px;height:90px;margin:-45px 0 0 -45px;background:var(--hi);color:var(--ink);box-shadow:0 6px 0 color-mix(in srgb,var(--hi) 55%,var(--ink))}
.node.final.locked{background:var(--line);color:var(--muted)}
.nlabel{position:absolute;width:150px;transform:translateY(-50%);line-height:1.2;pointer-events:none}
.nlabel.r{margin-left:52px}
.nlabel.l{transform:translate(calc(-100% - 52px),-50%);text-align:right}
.nlabel b{display:block;font-family:var(--display);font-size:1.02rem}
.nlabel small{color:var(--muted);font-size:.78rem}
.nstars{color:var(--hi);letter-spacing:2px;font-size:.95rem}
.nstars .off{color:var(--line)}
.me{position:absolute;margin-left:-23px;pointer-events:none;z-index:2}
.me .bot{width:46px;height:46px;animation:hop 1.4s ease-in-out infinite}

/* ---------- briefing / level top ---------- */
.brief{display:grid;justify-items:center;text-align:center;gap:10px;padding-block:10px}
.brief .boss{width:170px;height:170px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);font-size:.88rem;font-weight:700;background:var(--card)}
.lvtop{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.phases{flex:1;display:flex;gap:5px}
.phases i{flex:1;height:10px;border-radius:99px;background:var(--line);transition:background .3s}
.phases i.done{background:var(--good)}
.phases i.cur{background:var(--accent)}

/* ---------- mission ---------- */
.obj{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--soft);border:2px solid transparent;margin-bottom:14px;transition:all .3s}
.obj b{display:block;font-family:var(--display);font-size:clamp(1.05rem,2.4vw,1.3rem);line-height:1.25}
.obj>div{flex:1;min-width:0}
.obj.done{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card))}
.check{width:30px;height:30px;flex:none;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-weight:800;transition:all .3s}
.obj.done .check{background:var(--good);border-color:var(--good);color:var(--card);animation:hop .5s}
.intel{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--hi) 22%,var(--card));border:1px solid color-mix(in srgb,var(--hi) 55%,var(--line));margin-top:14px;animation:pop .45s both}
.intel .gem{width:28px;height:28px;flex:none;border-radius:8px;background:var(--hi);display:grid;place-items:center;font-weight:800;color:var(--ink);transform:rotate(45deg)}
.intel .gem span{transform:rotate(-45deg)}

/* ---------- rapid fire ---------- */
.rf{display:grid;gap:14px}
.rf-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.combo{font-family:var(--display);font-weight:800;color:var(--hi);font-size:1.3rem;min-width:5ch;text-align:right;text-shadow:0 1px 0 var(--ink)}
.combo.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.5)}}
.timer{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);width:100%}
.timer i.low{background:var(--bad)}
.rf-card{min-height:190px;border-radius:22px;background:var(--card);border:3px solid var(--line);display:grid;place-items:center;text-align:center;padding:24px;font-family:var(--display);font-size:clamp(1.25rem,3.4vw,1.85rem);font-weight:700;line-height:1.25;text-wrap:balance;animation:cardin .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes cardin{from{transform:translateX(40px) rotate(4deg);opacity:0}}
.rf-card.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--card))}
.rf-card.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--card));animation:shake .35s}
.fb{min-height:3em;margin:0;text-align:center;font-weight:700}
.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}
.fb span{display:block;font-weight:400;color:var(--ink)}
.rf-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big-btn{padding:18px 10px;border-radius:18px;font-family:var(--display);font-weight:800;font-size:1.35rem;border:0;color:var(--card);transition:transform .1s}
.big-btn small{display:block;font-family:var(--mono);font-size:.7rem;font-weight:400;opacity:.8}
.big-btn:active{transform:translateY(4px)}
.big-btn:disabled{opacity:.5}
.tbtn{background:var(--good);box-shadow:0 6px 0 color-mix(in srgb,var(--good) 55%,var(--ink))}
.fbtn{background:var(--bad);box-shadow:0 6px 0 color-mix(in srgb,var(--bad) 55%,var(--ink))}
.results{text-align:center;display:grid;gap:12px;justify-items:center}

/* ---------- boss ---------- */
.arena{position:relative;border-radius:22px;background:radial-gradient(circle at 50% 38%,var(--soft),var(--card) 70%);border:1px solid var(--line);padding:16px;display:grid;justify-items:center;gap:8px;overflow:hidden;margin-bottom:14px}
.arena.ouch{animation:shake .4s;box-shadow:inset 0 0 0 4px var(--bad)}
.bname{text-align:center}
.bname b{font-family:var(--display);font-size:1.4rem;display:block}
.boss{width:140px;height:140px;animation:wob 2.4s ease-in-out infinite;overflow:visible}
@keyframes wob{50%{transform:translateY(-6px) scale(1.03,.97)}}
.boss.hit{animation:hit .45s}
@keyframes hit{20%{transform:translateX(-12px) rotate(-8deg);filter:brightness(1.8)}60%{transform:translateX(9px) rotate(5deg)}}
.boss.dead{animation:die .9s forwards}
@keyframes die{30%{transform:scale(1.2) rotate(-10deg)}to{transform:scale(0) rotate(40deg);opacity:0}}
.hp{width:min(320px,100%);height:14px;border-radius:99px;background:var(--line);overflow:hidden;border:2px solid var(--ink)}
.hp i{display:block;height:100%;background:var(--bad);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.hearts{display:flex;gap:6px}
.heart{width:28px;height:28px;fill:var(--bad);transition:opacity .3s}
.heart.lost{fill:var(--line);animation:shake .4s}
.dmg{position:absolute;left:50%;top:30%;font-family:var(--display);font-weight:800;font-size:2.2rem;color:var(--bad);animation:floatup 1s forwards;pointer-events:none;text-shadow:0 2px 0 var(--card)}
.shot{position:absolute;left:calc(50% - 10px);bottom:12px;width:20px;height:20px;border-radius:6px;background:var(--hi);border:2px solid var(--ink);pointer-events:none}
.q{font-family:var(--display);font-size:1.3rem;font-weight:700;margin:0 0 14px;text-wrap:balance}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;transition:border-color .2s,background .2s,transform .15s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateX(3px)}
.opt .L{width:28px;height:28px;flex:none;border-radius:8px;background:var(--paper);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:.85rem}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 13%,var(--card))}
.opt.right .L{background:var(--good);color:var(--card)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--card));animation:shake .35s}
.opt:disabled{cursor:default}
.why{margin:12px 0 0;padding:10px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line)}

/* ---------- victory / deck / cert ---------- */
.victory{display:grid;justify-items:center;text-align:center;gap:12px}
.victory h2{font-size:clamp(1.6rem,4.5vw,2.4rem);font-weight:800}
.stars{display:flex;gap:10px}
.star{width:62px;height:62px;fill:var(--line)}
.star.on{fill:var(--hi);stroke:var(--ink);stroke-width:1;animation:starin .5s cubic-bezier(.2,1.6,.4,1) both;animation-delay:var(--d)}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}}
.fcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;width:100%}
.fc{perspective:900px;border:0;background:none;padding:0;min-height:120px;animation:pop .45s both;animation-delay:var(--d,0s)}
.fc-in{position:relative;display:block;height:100%;min-height:120px;transition:transform .55s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-f,.fc-b{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:14px;display:grid;place-items:center;text-align:center}
.fc-f{background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:800;font-size:1.2rem}
.fc-b{background:var(--card);border:1px solid var(--line);transform:rotateY(180deg);font-size:.95rem}
.fc.locked .fc-f{background:var(--line);color:var(--muted)}
.cert{border:3px double var(--ink);border-radius:16px;padding:28px;text-align:center;display:grid;gap:8px;background:linear-gradient(135deg,var(--soft),var(--card));max-width:560px;width:100%}
.cert h3{font-size:clamp(1.6rem,5vw,2.4rem);font-weight:800}
input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:84px;resize:vertical}

/* ---------- mission widgets ---------- */
.tok{font-family:var(--mono);padding:3px 7px;border-radius:7px;background:var(--t0);display:inline-flex;flex-direction:column;align-items:center;line-height:1.25;animation:pop .35s both;animation-delay:var(--d,0s);white-space:pre}
.tok small{font-size:.62rem;color:var(--muted)}
.c1{background:var(--t1)}.c2{background:var(--t2)}.c3{background:var(--t3)}.c4{background:var(--t4)}.c5{background:var(--t5)}
.tok .sp{color:var(--muted);font-style:normal}
.tok-out{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px;max-height:220px;overflow:auto;padding:2px}
.tok-out .tok{font-size:.95rem}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px;transition:border-color .3s,background .3s}
.stat.hit{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card))}
.stat b{display:block;font-family:var(--display);font-size:1.5rem}
.stat span{font-size:.8rem;color:var(--muted)}
.sentence{font-family:var(--display);font-size:clamp(1.4rem,3vw,2rem);font-weight:700;min-height:2.4em;margin-bottom:10px}

/* ---------- guided lessons ---------- */
.buildrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

function sfx(k){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const n={ok:[660,880],bad:[200,130],hit:[330,520,700],win:[523,659,784,1046],tap:[700],lvl:[392,523,659,784,1046]}[k],t=AC.currentTime;

/* ================= helpers used by several widgets ================= */
function tokenize(str){
  // shortcut: heuristic splitter, real tokenizers (BPE) learn merges from data; fine for teaching
  const out=[];
  for(const m of str.matchAll(/(\s?)([A-Za-z]+|\d{1,3}|[^\sA-Za-z\d])|\s+/gu)){
    if(m[2]===undefined){out.push(m[0]);continue}
    const sp=m[1],w=m[2];
    if(/^[A-Za-z]+$/.test(w)&&w.length>6){for(let i=0;i<w.length;i+=4)out.push((i?'':sp)+w.slice(i,i+4))}
    else out.push(sp+w);
  }
  return out;
}
const hash=s=>{let h=7;for(const c of s)h=(h*31+c.codePointAt(0))%100003;return h};
function apiCost(msgsPerDay,inTok,outTok,pricePerMIn,pricePerMOut){return 30*msgsPerDay*(inTok*pricePerMIn+outTok*pricePerMOut)/1e6}

function learn(el,done){
  el.innerHTML=`<div class="tools"><div class="seg"><button class="seg-b on" data-c="0"><i class="dot cat"></i>Add cat</button><button class="seg-b" data-c="1"><i class="dot dog"></i>Add dog</button></div><button class="btn primary" data-a="train">Train</button><button class="btn ghost" data-a="reset">Reset</button></div>
  <div class="cv-wrap"><canvas class="cv" aria-label="Scatter plot of cats and dogs by size and ear pointiness"></canvas><span class="ax ax-x">size →</span><span class="ax ax-y">↑ ear pointiness</span></div>
  <div class="readout mono"><span>your cats <b data-o="a0">0/2</b></span><span>your dogs <b data-o="a1">0/2</b></span><span>w₁ <b data-o="w0">0.00</b></span><span>w₂ <b data-o="w1">0.00</b></span><span>bias <b data-o="w2">0.00</b></span><span>accuracy <b data-o="acc">–</b></span></div>`;
  const cv=el.querySelector('canvas'),x=cv.getContext('2d'),ink=css('--ink'),card=css('--card'),cat=css('--cat'),dog=css('--dog');
  let W=0,H=260,cls=0,running=false,trained=false,w=[0,0,0],pts=[],added=[0,0];
  const f=v=>(v-.5)*4,sig=z=>1/(1+Math.exp(-z)),pr=(a,b)=>sig(w[0]*f(a)+w[1]*f(b)+w[2]);
  const acc=()=>pts.filter(([a,b,y])=>(pr(a,b)>.5)==y).length/pts.length;
  const reset=()=>{const r=seed(7);pts=[];w=[0,0,0];trained=false;added=[0,0];for(let i=0;i<7;i++){pts.push([.26+(r()-.5)*.28,.72+(r()-.5)*.28,0]);pts.push([.72+(r()-.5)*.28,.3+(r()-.5)*.28,1])}};
  const size=()=>{const d=devicePixelRatio||1;W=cv.clientWidth;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0)};
  function step(){const g=[0,0,0];for(const[a,b,y]of pts){const e=pr(a,b)-y;g[0]+=e*f(a);g[1]+=e*f(b);g[2]+=e}for(let k=0;k<3;k++)w[k]-=.6*g[k]/(pts.length||1)}
  function draw(){
    x.clearRect(0,0,W,H);const c=14;
    if(trained||running)for(let gx=0;gx<W;gx+=c)for(let gy=0;gy<H;gy+=c){const p=pr((gx+c/2)/W,1-(gy+c/2)/H);x.globalAlpha=Math.abs(p-.5)*.5;x.fillStyle=p>.5?dog:cat;x.fillRect(gx,gy,c,c)}
    x.globalAlpha=1;
    if(Math.abs(w[1])>1e-3){x.strokeStyle=ink;x.lineWidth=2;x.setLineDash([6,5]);x.beginPath();[0,1].forEach(a=>{const py=(-(w[0]*f(a)+w[2])/w[1])/4+.5;a?x.lineTo(a*W,(1-py)*H):x.moveTo(0,(1-py)*H)});x.stroke();x.setLineDash([])}
    for(const[a,b,y]of pts){x.beginPath();x.arc(a*W,(1-b)*H,7,0,7);x.fillStyle=y?dog:cat;x.fill();x.lineWidth=2;x.strokeStyle=card;x.stroke()}
    w.forEach((v,k)=>el.querySelector(`[data-o="w${k}"]`).textContent=v.toFixed(2));
    added.forEach((n,k)=>el.querySelector(`[data-o="a${k}"]`).textContent=Math.min(n,2)+'/2');
    el.querySelector('[data-o="acc"]').textContent=trained||running?Math.round(acc()*100)+'%':'–';
  }
  cv.onclick=e=>{const r=cv.getBoundingClientRect();if(!r.width||running)return;pts.push([(e.clientX-r.left)/r.width,1-(e.clientY-r.top)/r.height,cls]);added[cls]++;sfx('tap');draw()};
  el.onclick=e=>{
    const s=e.target.closest('[data-c]');if(s){cls=+s.dataset.c;el.querySelectorAll('.seg-b').forEach(b=>b.classList.toggle('on',b===s))}
    const a=e.target.closest('[data-a]');if(!a||running)return;
    if(a.dataset.a==='reset'){reset();draw();return}
    running=true;w=[0,0,0];let t=0;
    (function loop(){for(let i=0;i<(RM?400:4);i++)step();draw();if(!RM&&++t<100&&cv.isConnected)setTimeout(loop,16);else{running=false;trained=true;draw();
      if(added[0]<2||added[1]<2)toast('Trained! Now add 2 cats and 2 dogs of your own, then train again.');
      else if(acc()<1){toast('Not 100% yet. Some points overlap. Reset or add clearer examples.');mood('oops')}
      else done()}})();
  };
  addEventListener('resize',()=>{if(cv.isConnected){size();draw()}});
  reset();size();draw();
}

function nextTok(el,done){
  const steps=[[['mat',42],['sofa',22],['roof',14],['keyboard',12],['moon',3]],[['and',50],['then',30],['while',12],['because',5]],[['purred',40],['slept',30],['yawned',17],['stared',10]],[['happily',35],['all day',30],['at me',20],['loudly',15]]];

  const probs=()=>{const c=steps[i],raw=c.map(([,p])=>Math.pow(p,1/T)),s=raw.reduce((a,b)=>a+b,0);return c.map(([w],k)=>[w,raw[k]/s])};
  const sent=()=>el.querySelector('.sentence').innerHTML=words.map((w,k)=>`<span class="w ${k>=5?'new':''}">${w}</span>`).join(' ')+(i<steps.length?' <span class="caret"></span>':'.');
  function bars(){const b=el.querySelector('.bars');if(i>=steps.length){b.innerHTML=hot?'<p class="verdict">Every word was one prediction from a probability list. That is all an LLM does.</p>':'<p class="verdict">Sentence done, but the objective needs a model pick at temperature 1.5 or higher. Start over and try it.</p>';return}
    b.innerHTML=probs().map(([w,p])=>`<button class="bar" data-w="${w}"><span class="bar-w">${w}</span><span class="bar-track"><span class="bar-fill" style="width:0"></span></span><span class="bar-p mono">${(p*100).toFixed(0)}%</span></button>`).join('');
    requestAnimationFrame(()=>requestAnimationFrame(update))}
  function update(){if(i>=steps.length)return;const p=probs();el.querySelectorAll('.bar').forEach((b,k)=>{b.querySelector('.bar-fill').style.width=(p[k][1]*100).toFixed(1)+'%';b.querySelector('.bar-p').textContent=(p[k][1]*100).toFixed(0)+'%'})}
  function pick(w){const b=el.querySelector(`.bar[data-w="${w}"]`);if(b)b.classList.add('picked');sfx('tap');el.style.pointerEvents='none';setTimeout(()=>{el.style.pointerEvents='';words.push(w);i++;sent();bars();if(i===steps.length&&hot)done()},RM?0:450)}
  el.querySelector('#temp').oninput=e=>{T=+e.target.value;el.querySelector('[data-o="tv"]').textContent=T.toFixed(1);update()};

}

  const D=['Refund policy: refunds within 30 days of purchase.','Shipping: orders arrive in 2–5 days.','Returns: print a return label from your account.','Support hours: 9–5, Monday to Friday.'];
  const Q={'refund':[.93,.2,.55,.1],'money back':[.88,.12,.5,.08],'when will my order arrive':[.15,.91,.3,.2]};
  let mode='kw';
  el.innerHTML=`<div class="tools"><div class="seg"><button class="seg-b on" data-m="kw">Keyword search</button><button class="seg-b" data-m="sem">Semantic search</button></div></div>${simWin('Help center search','<div data-o="r" style="display:grid;gap:8px"><span class="hint" style="margin:0">Pick a search below.</span></div>')}<div class="sim-chips">${Object.keys(Q).map(q=>`<button class="schip" data-q="${q}">${q}</button>`).join('')}</div>`;
  const hit=tasker(el,['Keyword search for "money back"','Semantic search for "money back"'],done);
  el.onclick=e=>{const m=e.target.closest('[data-m]');if(m){mode=m.dataset.m;el.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b===m));sfx('tap')}
    const b=e.target.closest('[data-q]');if(!b)return;const q=b.dataset.q,r=el.querySelector('[data-o="r"]');
    if(mode==='kw'){const res=D.filter(d=>q.split(' ').some(w=>w.length>3&&d.toLowerCase().includes(w)));
      r.innerHTML=`<p class="lbl" style="margin:0">Documents containing the words "${q}"</p>`+(res.length?res.map(d=>`<div class="doc">${d}</div>`).join(''):'<div class="sline err">0 results. No document has those exact words.</div>');sfx(res.length?'tap':'bad');if(q==='money back')hit(0)}
    else{r.innerHTML=`<p class="lbl" style="margin:0">Closest in meaning to "${q}" (embedding similarity)</p>`+D.map((d,i)=>[d,Q[q][i]]).sort((a,b)=>b[1]-a[1]).map(([d,s],i)=>`<div class="doc ${i?'':'best'}"><span>${d}</span><span class="mono">${s.toFixed(2)}</span></div>`).join('');sfx('tap');if(q==='money back')hit(1)}};
}

/* ================= state + HUD ================= */
const KEY='ai-quest.v1';
let S={xp:0,stars:{},sound:true,name:''};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const scr=$('#screen');let R=null,keyH=null;
function hud(){$('#lvl').textContent=Math.floor(S.xp/100)+1;$('#xp').textContent=S.xp+' XP';$('#xpfill').style.width=S.xp%100+'%';$('#stars').textContent=Object.values(S.stars).reduce((a,b)=>a+b,0);const s=$('#snd');s.textContent=S.sound?'Sound on':'Sound off';s.setAttribute('aria-pressed',S.sound)}
function xp(n){const lv=Math.floor(S.xp/100);S.xp+=n;save();hud();const r=$('#xp').getBoundingClientRect(),f=document.createElement('span');f.className='xpfloat';f.textContent='+'+n+' XP';f.style.left=r.left+'px';f.style.top=r.bottom+6+'px';document.body.append(f);setTimeout(()=>f.remove(),1200);
  if(Math.floor(S.xp/100)>lv){toast(`Level up! You are now level ${Math.floor(S.xp/100)+1}.`);sfx('lvl')}}
function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2800)}
function go(html){keyH=null;scr.innerHTML=`<div class="scr">${html}</div>`;scrollTo({top:0})}
function confetti(){if(RM)return;const c=document.createElement('canvas');c.className='confetti';document.body.append(c);const d=devicePixelRatio||1,W=innerWidth,H=innerHeight;c.width=W*d;c.height=H*d;const x=c.getContext('2d');x.scale(d,d);
  const cols=['--accent','--hi','--good','--cat','--pink'].map(css),ps=Array.from({length:160},()=>({x:W/2,y:H/3,vx:(Math.random()-.5)*15,vy:-Math.random()*13-3,r:Math.random()*7+4,c:cols[Math.random()*cols.length|0],a:Math.random()*6}));let t=0;
  (function f(){x.clearRect(0,0,W,H);for(const p of ps){p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()}if(++t<120)requestAnimationFrame(f);else c.remove()})()}

/* ================= world map ================= */
const unlocked=i=>i===0||(LV[i].final?LV.slice(0,-1).every(l=>S.stars[l.id]):!!S.stars[LV[i-1].id]);
function showMap(){
  R=null;const cur=LV.findIndex((l,i)=>unlocked(i)&&!S.stars[l.id]),gap=118,top=70;
  const pts=LV.map((_,i)=>[50+28*Math.sin(i*1.15),top+i*gap]),H=top+(LV.length-1)*gap+90;
  const path=ps=>ps.map(([x,y],i)=>i?`C${ps[i-1][0]} ${ps[i-1][1]+gap/2} ${x} ${y-gap/2} ${x} ${y}`:`M${x} ${y}`).join(' ');
  const reach=cur<0?LV.length:cur+1,cleared=LV.filter(l=>S.stars[l.id]&&!l.final).length;
  go(`<div class="maphead"><div><p class="tag">World map</p><h1>AI Quest</h1></div><span class="pill">${cleared} / ${LV.length-1} levels cleared</span></div>
  <div class="world" style="height:${H}px"><svg class="trail" viewBox="0 0 100 ${H}" preserveAspectRatio="none" aria-hidden="true"><path class="p0" d="${path(pts)}"/><path class="p1" d="${path(pts.slice(0,reach))}"/></svg>
  ${LV.map((l,i)=>{const[x,y]=pts[i],u=unlocked(i),st=S.stars[l.id]||0,cls=[l.final?'final':'',!u?'locked':st?'cleared':'',i===cur?'cur':''].join(' ');
    return `<button class="node ${cls}" style="left:${x}%;top:${y}px" data-i="${i}" ${u?'':'disabled'} aria-label="${l.name}${u?'':' (locked)'}">${u?(l.final?'★':i+1):'<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 10V7a5 5 0 0110 0v3h1a1 1 0 011 1v10a1 1 0 01-1 1H6a1 1 0 01-1-1V11a1 1 0 011-1h1zm2 0h6V7a3 3 0 00-6 0v3z"/></svg>'}</button>
    <div class="nlabel ${x<50?'r':'l'}" style="left:${x}%;top:${y}px"><b>${l.name}</b><small>Boss: ${l.boss}</small>${l.final?'':`<div class="nstars">${[0,1,2].map(k=>`<span class="${k<st?'':'off'}">★</span>`).join('')}</div>`}</div>`}).join('')}
  ${cur>=0?`<div class="me" style="left:${pts[cur][0]}%;top:${pts[cur][1]-92}px">${BOT}</div>`:''}</div>
  <div class="actbar"><button class="btn ghost small" id="resetAll">Reset progress</button>${cur>=0?`<button class="btn primary go" data-i="${cur}">Play level ${LV[cur].final?'★':cur+1}</button>`:'<span class="pill">All clear!</span>'}</div>`);
  scr.onclick=e=>{const n=e.target.closest('[data-i]');if(n&&!n.disabled){sfx('tap');brief(+n.dataset.i)}};
  let armed=false;$('#resetAll').onclick=e=>{e.stopPropagation();if(!armed){armed=true;e.target.textContent='Tap again to erase everything';setTimeout(()=>{armed=false;if(e.target.isConnected)e.target.textContent='Reset progress'},3000);return}S={xp:0,stars:{},sound:S.sound,name:''};save();hud();showMap()};
  if(cur>0){const n=$(`.node[data-i="${cur}"]`);n&&n.scrollIntoView({block:'center',behavior:RM?'auto':'smooth'})}
}

function brief(i){
  const L=LV[i],st=S.stars[L.id]||0;
  go(`<div class="card brief"><p class="tag">${L.final?'Final level':'Level '+(i+1)}</p><h2 style="font-size:clamp(1.6rem,4.5vw,2.3rem)">${L.name}</h2>${bossSVG(L.col,L.shape)}<p style="margin:0">Defeat <b>${L.boss}</b></p>
    <div class="chips">${L.learn.length?`<span class="chip">${L.learn.length} quick lessons</span>`:''}${L.missions.length?`<span class="chip">${L.missions.length} mission${L.missions.length>1?'s':''}</span><span class="chip">Incident desk</span>`:''}<span class="chip">Boss · ${L.bossOps.length} attacks · 3 hearts</span></div>
    ${st?`<div class="nstars">${[0,1,2].map(k=>`<span class="${k<st?'':'off'}">★</span>`).join('')}</div>`:''}</div>
    <div class="actbar"><button class="btn ghost" data-map>Map</button><button class="btn primary go" data-start>Start</button></div>`);
  scr.onclick=e=>{if(e.target.closest('[data-map]'))showMap();if(e.target.closest('[data-start]')){sfx('ok');start(i)}};
}

/* ================= level run ================= */
function start(i){const L=LV[i];R={L,i,hearts:3,xp0:S.xp,ph:[...L.learn.map((_,k)=>['l',k]),...L.missions.map((_,k)=>['m',k]),...(L.inc?[['r']]:[]),['b']],p:0};phase()}
const lvTop=()=>`<div class="lvtop"><button class="btn ghost small" data-quit aria-label="Quit to map">✕</button><div class="phases">${R.ph.map((_,k)=>`<i class="${k<R.p?'done':k===R.p?'cur':''}"></i>`).join('')}</div><span class="tag" style="margin:0">${R.L.final?'Final':'Lv '+(R.i+1)}</span></div>`;
function phase(){const[t,k]=R.ph[R.p];scr.onclick=e=>{if(e.target.closest('[data-quit]'))showMap()};(t==='l'?lesson:t==='m'?mission:t==='r'?rapid:boss)(k)}

function lesson(k){
  const s=R.L.learn[k],last=k===R.L.learn.length-1;
  go(lvTop()+`<div class="obj">${BOT}<div><span class="tag">Learn · ${k+1} of ${R.L.learn.length}</span><b>${s.p}</b></div></div><div class="card" data-w></div><div data-intel></div><div class="actbar"><span></span><button class="btn primary" data-next disabled>Try it first</button></div>`);
  const nb=$('[data-next]');let d=false;
  ENG[s.t]($('[data-w]'),()=>{if(d)return;d=true;$('[data-intel]').innerHTML=`<div class="intel"><span class="gem"><span>!</span></span><div><span class="tag">Key idea</span><br>${s.aha}</div></div>`;
    nb.disabled=false;nb.textContent=last?'Start the missions':'Next';nb.classList.add('go');xp(5)},s.a);
  nb.onclick=()=>{if(last)toast('Now use what you learned!');nextPhase()};
}
function nextPhase(){R.p++;phase()}

function mission(k){
  const[obj,w,intel,hint]=R.L.missions[k];
  go(lvTop()+`<div class="obj">${BOT}<div><span class="tag">Mission ${k+1} of ${R.L.missions.length}</span><b>${obj}</b></div><span class="check" aria-hidden="true"></span></div><div class="card" data-w></div><div data-intel></div>
  <div class="actbar">${hint?'<button class="btn ghost" data-hint>Hint</button>':'<span></span>'}<button class="btn primary" data-next disabled>Complete the mission</button></div>`);
  const nb=$('[data-next]');let done=false;
  w($('[data-w]'),()=>{if(done)return;done=true;$('.obj').classList.add('done');$('.check').textContent='✓';$('[data-intel]').innerHTML=`<div class="intel"><span class="gem"><span>!</span></span><div><span class="tag">Unlocked</span><br>${intel}</div></div>`;
    nb.disabled=false;nb.textContent='Continue';nb.classList.add('go');xp(20);sfx('win');mood('happy')});
  nb.onclick=()=>nextPhase();
  if(hint)$('[data-hint]').onclick=()=>toast(hint);
}

const opView=(o,ord)=>`<p class="q" style="margin-bottom:10px">${o.s}</p>${simWin(o.w[0],simLines(o.w[1]),'opwin')}<div class="opts" style="margin-top:12px">${ord.map((k,n)=>`<button class="opt" data-a="${k}"><span class="L">${n+1}</span><span>${o.a[k][0]}</span></button>`).join('')}</div>`;
// Plays the chosen action's outcome on the sim screen; a wrong pick also plays the better move. Returns true if best.
function playOp(root,o,k){
  const g=o.a.findIndex(a=>a[2]),body=root.querySelector('.opwin .sim-body');root.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  if(k>=0){root.querySelector(`.opt[data-a="${k}"]`).classList.add(k===g?'right':'wrong');body.insertAdjacentHTML('beforeend',`<div class="outcome">${simLines(o.a[k][1])}</div>`)}
  if(k!==g){root.querySelector(`.opt[data-a="${g}"]`).classList.add('right');body.insertAdjacentHTML('beforeend',`<div class="outcome"><div class="sline">Better move: <b>${o.a[g][0]}</b></div>${simLines(o.a[g][1])}</div>`)}
  body.scrollTop=body.scrollHeight;return k===g;
}

function rapid(){
  const items=shuffle([...R.L.inc]),TL=20000;let i=0,ok=0,combo=0,best=0,earned=0,raf,t0,locked=true,ord;
  go(lvTop()+`<div class="rf"><div class="rf-top"><span class="tag" style="margin:0">Incident desk · fix it fast</span><span class="mono" data-o="n"></span><span class="combo" data-o="c"></span></div><div class="timer"><i></i></div><div class="card" data-o="card"></div><div class="actbar"><span class="fb" data-o="fb" style="text-align:left;min-height:0"></span><button class="btn primary go" data-go hidden>Next incident</button></div></div>`);
  const o=k=>$(`[data-o="${k}"]`),bar=$('.timer i'),nx=$('[data-go]');
  function show(){if(i>=items.length)return end();locked=false;ord=shuffle(items[i].a.map((_,k)=>k));o('card').innerHTML=`<div class="scr">${opView(items[i],ord)}</div>`;o('n').textContent=`${i+1} / ${items.length}`;o('fb').className='fb';o('fb').textContent='Pick the best action.';nx.hidden=true;t0=performance.now();raf=requestAnimationFrame(tick)}
  function tick(t){if(!bar.isConnected)return;const k=Math.max(0,1-(t-t0)/TL);bar.style.width=k*100+'%';bar.classList.toggle('low',k<.3);if(k<=0)answer(-1);else raf=requestAnimationFrame(tick)}
  function answer(k){if(locked)return;locked=true;cancelAnimationFrame(raf);const right=playOp(o('card'),items[i],k);
    if(right){ok++;combo++;best=Math.max(best,combo);const g=5*Math.min(combo,5);earned+=g;S.xp+=g;save();hud();sfx('ok');mood('happy')}else{combo=0;sfx('bad')}
    o('fb').className='fb '+(right?'ok':'no');o('fb').textContent=right?'Fixed!':k<0?'Time up!':'That made it worse.';
    const cb=o('c');cb.textContent=combo>1?`x${combo} combo`:'';cb.classList.remove('bump');void cb.offsetWidth;if(combo>1)cb.classList.add('bump');nx.hidden=false}
  function end(){keyH=null;go(lvTop()+`<div class="card results"><p class="tag">Incident desk closed</p><div class="big">${ok} / ${items.length}</div><div class="chips"><span class="chip">Best combo x${best}</span><span class="chip">+${earned} XP</span></div><p style="margin:0">${ok===items.length?'Every incident fixed!':'The boss will break things the same way. Stay sharp.'}</p></div><div class="actbar"><span></span><button class="btn primary go" data-next>Face the boss</button></div>`);
    scr.onclick=e=>{if(e.target.closest('[data-quit]'))showMap();if(e.target.closest('[data-next]'))nextPhase()};if(ok===items.length)confetti()}
  nx.onclick=()=>{i++;show()};
  scr.onclick=e=>{if(e.target.closest('[data-quit]')){cancelAnimationFrame(raf);showMap();return}const b=e.target.closest('.opt');if(b&&!b.disabled)answer(+b.dataset.a)};
  keyH=e=>{const n=+e.key;if(n>=1&&n<=ord.length&&!locked)answer(ord[n-1]);if(e.key==='Enter'&&!nx.hidden)nx.click()};
  show();
}

function boss(){
  const L=R.L,queue=L.final?shuffle([...L.bossOps]):[...L.bossOps],max=queue.length;let hp=max,busy=false,ord;R.hearts=3;
  go(lvTop()+`<div class="arena"><div class="bname"><span class="tag">Boss</span><b>${L.boss}</b></div>${bossSVG(L.col,L.shape)}<div class="hp" role="progressbar" aria-label="Boss health" aria-valuemin="0" aria-valuemax="${max}" aria-valuenow="${max}"><i style="width:100%"></i></div><div class="hearts" data-o="h" aria-label="Your hearts"></div></div><div data-o="q"></div>`);
  const ar=$('.arena'),bs=$('.arena .boss'),qa=$('[data-o="q"]');
  const hearts=()=>{$('[data-o="h"]').innerHTML=[0,1,2].map(k=>HEART.replace('class="heart"',`class="heart ${k<R.hearts?'':'lost'}"`)).join('')};
  function ask(){busy=false;ord=shuffle(queue[0].a.map((_,k)=>k));qa.innerHTML=`<div class="card scr"><span class="tag">${L.boss} attacks!</span>${opView(queue[0],ord)}</div><div data-o="why"></div>`}
  function pick(k){if(busy)return;busy=true;const it=queue[0];
    if(playOp(qa,it,k)){queue.shift();hp--;sfx('hit');
      const s=document.createElement('span');s.className='shot';ar.append(s);s.animate([{transform:'translateY(0) rotate(0)'},{transform:`translateY(-${ar.clientHeight*.62}px) rotate(540deg)`}],{duration:RM?1:380,easing:'ease-in'});
      setTimeout(()=>{s.remove();bs.classList.remove('hit');void bs.getBoundingClientRect();bs.classList.add('hit');const d=document.createElement('span');d.className='dmg';d.textContent='-1';ar.append(d);setTimeout(()=>d.remove(),1000);
        $('.hp i').style.width=hp/max*100+'%';$('.hp').setAttribute('aria-valuenow',hp);
        if(hp===0){bs.classList.add('dead');setTimeout(victory,1100)}else setTimeout(ask,1300)},RM?1:380)}
    else{R.hearts--;hearts();sfx('bad');ar.classList.remove('ouch');void ar.offsetWidth;ar.classList.add('ouch');queue.push(queue.shift());
      qa.querySelector('[data-o="why"]').innerHTML=`<div class="actbar"><span class="hint" style="margin:0">Ouch, -1 heart. This attack comes back later.</span><button class="btn primary" data-cont>${R.hearts?'Keep fighting':'Continue'}</button></div>`;
      qa.querySelector('[data-cont]').onclick=()=>R.hearts?ask():defeat()}}
  qa.onclick=e=>{const b=e.target.closest('.opt');if(b&&!b.disabled)pick(+b.dataset.a)};
  keyH=e=>{const n=+e.key;if(n>=1&&n<=ord.length&&!busy)pick(ord[n-1])};
  hearts();ask();
}

function defeat(){
  go(lvTop()+`<div class="card results">${bossSVG(R.L.col,R.L.shape)}<h2>Out of hearts!</h2><p style="margin:0">${R.L.boss} wins this round. Your XP is safe.</p></div><div class="actbar"><button class="btn ghost" data-map>Map</button><button class="btn primary go" data-retry>Retry boss</button></div>`);
  scr.onclick=e=>{if(e.target.closest('[data-map]')||e.target.closest('[data-quit]'))showMap();if(e.target.closest('[data-retry]'))boss()};
}

function victory(){
  const L=R.L,stars=R.hearts,prev=S.stars[L.id]||0;S.stars[L.id]=Math.max(prev,stars);save();xp(prev?15:50);sfx('win');confetti();
  if(L.final)return cert();
  const nx=LV[R.i+1];
  go(`<div class="victory"><p class="tag">Level ${R.i+1} cleared</p><h2>${L.boss} defeated!</h2><div class="stars">${[0,1,2].map(k=>`<svg class="star ${k<stars?'on':''}" style="--d:${.2+k*.25}s" viewBox="0 0 24 24" aria-hidden="true">${STAR}</svg>`).join('')}</div><p style="margin:0">${['','Lost 2 hearts.','Lost 1 heart.','Flawless!'][stars]} · +${S.xp-R.xp0} XP this level</p>
    <p class="tag" style="margin-top:8px">${prev?'Your cards':'New cards collected'} · tap to flip</p><div class="fcs">${L.cards.map(([f,b],k)=>`<button class="fc" style="--d:${.8+k*.15}s" aria-label="${f}: tap to flip"><span class="fc-in"><span class="fc-f">${f}</span><span class="fc-b">${b}</span></span></button>`).join('')}</div></div>
    <div class="actbar"><button class="btn ghost" data-map>Map</button><button class="btn primary go" data-next>${nx&&unlocked(R.i+1)?'Next level':'Back to map'}</button></div>`);
  scr.onclick=e=>{const c=e.target.closest('.fc');if(c){c.classList.toggle('flip');sfx('tap')}if(e.target.closest('[data-map]'))showMap();if(e.target.closest('[data-next]'))nx&&unlocked(R.i+1)?brief(R.i+1):showMap()};
}

function cert(){
  const d=new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}),total=Object.values(S.stars).reduce((a,b)=>a+b,0);
  go(`<div class="victory"><p class="tag">The Singularity defeated</p><h2>You beat AI Quest!</h2><label class="tag" for="cert-name">Your name</label><input type="text" id="cert-name" maxlength="40" placeholder="Your name" value="${esc(S.name||'')}" style="max-width:360px"><div class="cert"><span class="tag">Certificate of completion</span><h3 data-o="nm"></h3><span>completed <b>AI Quest: AI From Zero</b></span><span class="mono hint">${total} stars · ${S.xp} XP · ${d}</span></div><p class="hint">Take a screenshot to keep it.</p></div><div class="actbar"><span></span><button class="btn primary" data-map>Back to map</button></div>`);
  const i=$('#cert-name'),nm=$('[data-o="nm"]'),up=()=>{S.name=i.value;nm.textContent=i.value.trim()||'Your name';save()};i.oninput=up;up();
  scr.onclick=e=>{if(e.target.closest('[data-map]'))showMap()};
}

function deck(){
  const all=LV.filter(l=>!l.final),got=all.filter(l=>S.stars[l.id]).reduce((n,l)=>n+l.cards.length,0),tot=all.reduce((n,l)=>n+l.cards.length,0);
  go(`<div class="maphead"><div><p class="tag">Collection</p><h1>Cards</h1></div><span class="pill">${got} / ${tot} collected</span></div>
  ${all.map(l=>`<p class="tag" style="margin-top:18px">${l.name}</p><div class="fcs">${l.cards.map(([f,b])=>S.stars[l.id]?`<button class="fc" aria-label="${f}: tap to flip"><span class="fc-in"><span class="fc-f">${f}</span><span class="fc-b">${b}</span></span></button>`:`<div class="fc locked"><span class="fc-in"><span class="fc-f">?</span></span></div>`).join('')}</div>`).join('')}
  <div class="actbar"><span></span><button class="btn primary" data-map>Back to map</button></div>`);
  scr.onclick=e=>{const c=e.target.closest('button.fc');if(c){c.classList.toggle('flip');sfx('tap')}if(e.target.closest('[data-map]'))showMap()};
}

$('#home').onclick=()=>showMap();
$('#deckBtn').onclick=()=>deck();
$('#snd').onclick=()=>{S.sound=!S.sound;save();hud();sfx('tap')};

// self-checks for the logic that does math
console.assert(tokenize('Hello world').length===2,'tokenize: two short words');
console.assert(tokenize('unbelievably').length===3,'tokenize: long word splits into 4-char chunks');
console.assert(Math.abs(apiCost(30,1500,400,3,15)-9.45)<1e-9,'apiCost: 30 msgs/day example');
console.assert(LV.every(l=>[...l.bossOps,...(l.inc||[])].every(o=>o.a.filter(a=>a[2]).length===1)),'every scenario has exactly one best action');
console.assert(LV.every(l=>l.final||l.learn.length&&l.learn.every(s=>ENG[s.t])),'every level has valid lessons');
hud();showMap();
</script>
